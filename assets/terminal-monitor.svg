<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Neural network telemetry monitor</title><desc id="desc">A neural network telemetry dashboard showing inference performance.</desc>
  <defs><linearGradient id="b" x2="1"><stop stop-color="#08111d"/><stop offset="1" stop-color="#123b43"/></linearGradient><style>.m{font:600 13px 'JetBrains Mono','Courier New',monospace}.v{font:700 21px 'JetBrains Mono','Courier New',monospace;fill:#f5fbff}.l{font:11px 'JetBrains Mono','Courier New',monospace;fill:#9ca3af}.p{fill:#091722;stroke:#39d0c8;stroke-opacity:.42}.w{fill:none;stroke:#39d0c8;stroke-width:2;stroke-dasharray:6 8;animation:x 2s linear infinite}.n{fill:#8ef5dc;animation:p 1.5s ease-in-out infinite}@keyframes x{to{stroke-dashoffset:-28}}@keyframes p{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.w,.n{animation:none}}</style></defs>
  <rect width="1000" height="190" rx="18" fill="url(#b)"/><rect x="1" y="1" width="998" height="188" rx="17" fill="none" stroke="#39d0c8" stroke-opacity=".45"/><text x="30" y="35" class="m" fill="#39d0c8">neural-network://inference/telemetry</text><text x="30" y="62" class="l">FORWARD PASS / OBJECT-DETECTION-SERVICE / HEALTHY</text>
  <g transform="translate(30 82)"><rect class="p" width="220" height="76" rx="9"/><text x="16" y="22" class="l">THROUGHPUT</text><text x="16" y="51" class="v">196 FPS</text><path class="w" d="M116 46l12-12 12 18 12-27 12 15 12-9 12 15 12-12 12 12"/></g><g transform="translate(270 82)"><rect class="p" width="220" height="76" rx="9"/><text x="16" y="22" class="l">LATENCY</text><text x="16" y="51" class="v">5.1 ms</text><path class="w" d="M116 48h82"/></g><g transform="translate(510 82)"><rect class="p" width="220" height="76" rx="9"/><text x="16" y="22" class="l">ACCURACY</text><text x="16" y="51" class="v">92.4% mAP</text><circle class="n" cx="178" cy="46" r="7"/><circle class="n" cx="198" cy="46" r="7"/></g><g transform="translate(750 82)"><rect class="p" width="220" height="76" rx="9"/><text x="16" y="22" class="l">DEPLOYMENT</text><text x="16" y="51" class="v">ONLINE</text><circle class="n" cx="184" cy="46" r="7"/></g>
</svg>
