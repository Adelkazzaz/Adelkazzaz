<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">Adel Kazzaz neural network identity</title><desc id="desc">A compact neural network diagram introducing Adel Kazzaz and his ML systems focus.</desc>
  <defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#08111d"/><stop offset="1" stop-color="#123b43"/></linearGradient><style>.m{font:600 15px 'JetBrains Mono','Courier New',monospace}.s{font:12px 'JetBrains Mono','Courier New',monospace}.l{stroke:#39d0c8;stroke-opacity:.3}.n{fill:#07131e;stroke:#39d0c8;stroke-width:2}.d{stroke:#8ef5dc;stroke-width:2;stroke-dasharray:5 8;animation:a 1.5s linear infinite}@keyframes a{to{stroke-dashoffset:-26}}@media(prefers-reduced-motion:reduce){.d{animation:none}}</style></defs>
  <rect width="1000" height="250" rx="18" fill="url(#b)"/><rect x="1" y="1" width="998" height="248" rx="17" fill="none" stroke="#39d0c8" stroke-opacity=".5"/>
  <text x="34" y="42" class="s" fill="#9ca3af">adel@github:~ / identity</text><text x="34" y="82" class="m" fill="#39d0c8">$ neural-network --identify</text><text x="34" y="115" class="m" fill="#f5fbff">Adel Kazzaz</text><text x="34" y="142" class="s" fill="#b8c5cc">ML Systems · MLOps · real-time computer vision</text>
  <g transform="translate(470 52)"><path class="l" d="M20 40L100 25M20 40L100 75M20 90L100 25M20 90L100 75M100 25L190 55M100 75L190 55"/><path class="d" d="M20 40L100 25M100 25L190 55"/><circle class="n" cx="20" cy="40" r="8"/><circle class="n" cx="20" cy="90" r="8"/><circle class="n" cx="100" cy="25" r="8"/><circle class="n" cx="100" cy="75" r="8"/><circle class="n" cx="190" cy="55" r="8"/><text x="0" y="126" class="s" fill="#9ca3af">input</text><text x="82" y="126" class="s" fill="#9ca3af">hidden</text><text x="170" y="126" class="s" fill="#9ca3af">output</text></g>
  <text x="34" y="220" class="s" fill="#9ca3af">$ echo "learn → infer → improve"</text>
