<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Adel Kazzaz neural network hero</title>
  <desc id="desc">An animated neural network with input, hidden, and output layers for ML systems and real-time computer vision.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#060d17"/><stop offset=".6" stop-color="#102b3b"/><stop offset="1" stop-color="#123f45"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#39d0c8" stop-opacity=".25"/><stop offset="1" stop-color="#39d0c8" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .m{font:600 14px 'JetBrains Mono','Courier New',monospace}.s{font:12px 'JetBrains Mono','Courier New',monospace}.b{font:700 31px 'JetBrains Mono','Courier New',monospace}.teal{fill:#39d0c8}.white{fill:#f5fbff}.muted{fill:#9ca3af}.line{stroke:#39d0c8;stroke-opacity:.3;stroke-width:1.5}.flow{stroke:#8ef5dc;stroke-width:2;stroke-dasharray:5 10;animation:flow 1.8s linear infinite}.n{fill:#07131e;stroke:#39d0c8;stroke-width:2;filter:url(#glow);animation:p 2s ease-in-out infinite}.n2{animation-delay:.45s}.n3{animation-delay:.9s}@keyframes flow{to{stroke-dashoffset:-30}}@keyframes p{50%{fill:#8ef5dc;transform:scale(1.2)}}@media(prefers-reduced-motion:reduce){.flow,.n{animation:none}}
    </style>
  </defs>
  <rect width="1000" height="420" rx="20" fill="url(#bg)"/><circle cx="780" cy="210" r="205" fill="url(#halo)"/><rect x="1" y="1" width="998" height="418" rx="19" fill="none" stroke="#39d0c8" stroke-opacity=".55"/>
  <text x="34" y="44" class="s muted">adel@github:~ / neural-systems</text><text x="34" y="92" class="m teal">$ whoami</text><text x="34" y="136" class="b white">Adel Kazzaz</text><text x="36" y="166" class="m muted">ML Systems · MLOps</text><text x="36" y="191" class="m muted">real-time computer vision</text><text x="36" y="240" class="m teal">$ mission --current</text><text x="36" y="267" class="s white">turning models into observable</text><text x="36" y="289" class="s white">production inference systems</text><text x="36" y="350" class="s muted">forward pass: build → measure → ship</text>
  <g transform="translate(560 62)"><text x="0" y="0" class="m teal">/model/architecture/live</text><text x="0" y="24" class="s muted">propagation monitor</text><g class="flow" fill="none"><path d="M42 100L150 70M42 100L150 130M42 160L150 70M42 160L150 130M150 70L270 100M150 70L270 160M150 130L270 100M150 130L270 160"/></g><g class="line" fill="none"><path d="M42 100L150 70M42 100L150 130M42 160L150 70M42 160L150 130M150 70L270 100M150 70L270 160M150 130L270 100M150 130L270 160"/></g><circle class="n" cx="42" cy="100" r="10"/><circle class="n n2" cx="42" cy="160" r="10"/><circle class="n n2" cx="150" cy="70" r="10"/><circle class="n" cx="150" cy="130" r="10"/><circle class="n n3" cx="270" cy="100" r="10"/><circle class="n" cx="270" cy="160" r="10"/><text x="16" y="207" class="s muted">INPUT</text><text x="125" y="207" class="s muted">HIDDEN</text><text x="250" y="207" class="s muted">OUTPUT</text><text x="0" y="246" class="s muted">throughput  <tspan class="white">196 FPS</tspan>   latency  <tspan class="white">5.1 ms</tspan></text><text x="0" y="267" class="s muted">accuracy   <tspan class="white">92.4% mAP</tspan>   status  <tspan class="teal">ONLINE</tspan></text></g>
</svg>
