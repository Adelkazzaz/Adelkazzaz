<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">Neural network production pipeline</title><desc id="desc">A neural network pipeline showing data, training, inference, and feedback.</desc>
  <defs><linearGradient id="b" x2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#123b4a"/></linearGradient><style>.m{font:600 14px 'JetBrains Mono','Courier New',monospace}.s{font:12px 'JetBrains Mono','Courier New',monospace}.n{fill:#0b1220;stroke:#39d0c8;stroke-width:1.5}.f{stroke:#8ef5dc;stroke-width:2;stroke-dasharray:8 10;animation:a 1.5s linear infinite}.p{fill:#8ef5dc;animation:b 1.8s ease-in-out infinite}@keyframes a{to{stroke-dashoffset:-36}}@keyframes b{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.f,.p{animation:none}}</style></defs>
  <rect width="1000" height="250" rx="18" fill="url(#b)"/><rect x="1" y="1" width="998" height="248" rx="17" fill="none" stroke="#39d0c8" stroke-opacity=".35"/><text x="34" y="42" class="m" fill="#39d0c8">neural-network://training-to-production</text><text x="34" y="68" class="s" fill="#9ca3af">learn from data, propagate signal, close the feedback loop</text>
  <g><rect class="n" x="34" y="120" width="190" height="70" rx="10"/><text x="52" y="147" class="m" fill="#f5fbff">01  INPUT</text><text x="52" y="170" class="s" fill="#9ca3af">prepare &amp; validate</text><rect class="n" x="284" y="120" width="190" height="70" rx="10"/><text x="302" y="147" class="m" fill="#f5fbff">02  LEARN</text><text x="302" y="170" class="s" fill="#9ca3af">train &amp; optimize</text><rect class="n" x="534" y="120" width="190" height="70" rx="10"/><text x="552" y="147" class="m" fill="#f5fbff">03  INFER</text><text x="552" y="170" class="s" fill="#9ca3af">serve low latency</text><rect class="n" x="784" y="120" width="182" height="70" rx="10"/><text x="802" y="147" class="m" fill="#f5fbff">04  FEEDBACK</text><text x="802" y="170" class="s" fill="#9ca3af">measure &amp; improve</text></g>
  <path class="f" d="M224 155h60M474 155h60M724 155h60"/><circle class="p" cx="224" cy="155" r="4"><animate attributeName="cx" values="224;284" dur="1.5s" repeatCount="indefinite"/></circle><circle class="p" cx="474" cy="155" r="4"><animate attributeName="cx" values="474;534" dur="1.5s" begin=".5s" repeatCount="indefinite"/></circle><circle class="p" cx="724" cy="155" r="4"><animate attributeName="cx" values="724;784" dur="1.5s" begin="1s" repeatCount="indefinite"/></circle><text x="34" y="222" class="s" fill="#9ca3af">● training status: converged  /  latency budget: protected  /  feedback loop: active</text>
</svg>
