<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">Animated ML systems pipeline</title>
  <desc id="desc">A terminal-style animation showing data moving through training, serving, and observability stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#123b4a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#39d0c8" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#39d0c8"/>
      <stop offset="1" stop-color="#8ef5dc" stop-opacity=".25"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font: 600 14px 'JetBrains Mono', 'Courier New', monospace; }
      .label { font: 600 13px 'JetBrains Mono', 'Courier New', monospace; fill: #f5fbff; }
      .muted { font: 12px 'JetBrains Mono', 'Courier New', monospace; fill: #9ca3af; }
      .node { fill: #0b1220; stroke: #39d0c8; stroke-width: 1.5; }
      .pulse { fill: #8ef5dc; filter: url(#glow); }
      .flow { stroke: url(#line); stroke-width: 2; stroke-dasharray: 8 10; animation: flow 1.5s linear infinite; }
      .blink { animation: blink 1.8s ease-in-out infinite; }
      .float { animation: float 3s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -36; } }
      @keyframes blink { 0%, 45%, 100% { opacity: .35; } 55%, 85% { opacity: 1; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .blink, .float { animation: none; }
      }
    </style>
  </defs>
  <rect width="1000" height="250" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="248" rx="17" fill="none" stroke="#39d0c8" stroke-opacity=".35"/>
  <circle cx="28" cy="27" r="6" fill="#ff6b6b"/>
  <circle cx="48" cy="27" r="6" fill="#ffd166"/>
  <circle cx="68" cy="27" r="6" fill="#39d0c8"/>
  <text x="92" y="32" class="mono" fill="#9ca3af">adel@github:~/ml-systems</text>
  <text x="34" y="68" class="mono" fill="#39d0c8">$ pipeline --run --production</text>
  <text x="34" y="91" class="muted">shipping reliable inference, one measurable step at a time</text>

  <g class="float">
    <rect class="node" x="34" y="132" width="190" height="70" rx="10"/>
    <text x="52" y="158" class="label">01  DATA</text>
    <text x="52" y="180" class="muted">prepare &amp; validate</text>
  </g>
  <g class="float" style="animation-delay:.4s">
    <rect class="node" x="284" y="132" width="190" height="70" rx="10"/>
    <text x="302" y="158" class="label">02  TRAIN</text>
    <text x="302" y="180" class="muted">evaluate &amp; optimize</text>
  </g>
  <g class="float" style="animation-delay:.8s">
    <rect class="node" x="534" y="132" width="190" height="70" rx="10"/>
    <text x="552" y="158" class="label">03  SERVE</text>
    <text x="552" y="180" class="muted">low-latency inference</text>
  </g>
  <g class="float" style="animation-delay:1.2s">
    <rect class="node" x="784" y="132" width="182" height="70" rx="10"/>
    <text x="802" y="158" class="label">04  OBSERVE</text>
    <text x="802" y="180" class="muted">measure &amp; improve</text>
  </g>
  <path class="flow" d="M224 167h60M474 167h60M724 167h60"/>
  <circle class="pulse" cx="224" cy="167" r="4"><animate attributeName="cx" values="224;284" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle class="pulse" cx="474" cy="167" r="4"><animate attributeName="cx" values="474;534" dur="1.5s" begin=".5s" repeatCount="indefinite"/></circle>
  <circle class="pulse" cx="724" cy="167" r="4"><animate attributeName="cx" values="724;784" dur="1.5s" begin="1s" repeatCount="indefinite"/></circle>
  <text x="34" y="232" class="muted blink">● system status: online  /  latency budget: protected  /  feedback loop: active</text>
</svg>
